[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ani-cli-sync"
version = "0.3.0"
description = "Automated AniList synchronization wrapper for ani-cli"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Nils Steenebruegge", email = "52573120+niStee@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = []
keywords = ["ani-cli", "anilist", "anime", "sync", "fzf", "mpv", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/niStee/ani-cli-sync"
Repository = "https://github.com/niStee/ani-cli-sync"
Issues = "https://github.com/niStee/ani-cli-sync/issues"

[project.scripts]
ani-cli-sync = "ani_cli_sync.cli:main"
ani-sync = "ani_cli_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ani_cli_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
