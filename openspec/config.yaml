schema: spec-driven

# Spec-driven development pilot for ani-cli-sync (2026-10-11). The method decision is
# aligned with the bahn pilot in ai-infra; these lines are what an agent cannot
# infer from the code.
context: |
  Order of work: spec delta first, then failing tests derived from its scenarios,
  then the code. A spec never replaces tests.
  Every guard or regression test ships as a positive/negative pair and is only
  trusted after a recorded sensitivity probe: weaken the guard, see the test fail,
  restore it (ai-infra ADR-012).
  A change proposal is needed for behavior changes (features, interfaces,
  workflows, user-visible config). A bug fix that restores already specified
  behavior needs a regression test, not a proposal, unless the bug is complex or
  in a critical path; then use current / expected / unchanged behavior. Refactors,
  renames and typos need neither.
  Decisions with lasting architectural impact go to docs/adr/ as an ADR that
  outlives the archived change; the proposal links it.
  AniList safety: never clobber or regress watchlist progress without explicit user
  intent; never advance on aborted or unverified playback.
  Zero external runtime dependencies: keep runtime purely in standard library.
  Translation model handles are governed by ai-infra's model-governance.json: the
  local LiteLLM gateway fails closed on an undeclared handle, so a model that is
  not registered there can never answer. A default cascade member must be
  registered there and reachable through the gateway.

rules:
  proposal:
    - Keep it under 500 words and link the GitHub issue it serves
    - State what is out of scope; it is as important as the scope
    - One vertical slice that can be merged on its own
  specs:
    - Requirements use SHALL and each has at least one WHEN/THEN scenario
    - Describe observable behavior only; no file names, types or internal APIs
    - Include the failure and refusal scenarios, not just the happy path
  design:
    - Diagrams MUST use valid Mermaid matching ai-infra ADR-017
    - Node labels with special characters must be double-quoted
    - Raw HTML tags in labels are prohibited
  tasks:
    - The first task writes the failing tests for the scenarios
    - Every task names the test or check that proves it done
    - "Every task names its tier, as '(tier: frontier|mid|low)' after the checkbox; frontier for specs, architecture and trust-core review, mid for implementing a sharpened spec against frozen tests, low for narrowly bounded mechanical work (ai-infra #1016)"
